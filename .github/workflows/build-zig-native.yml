name: Zig Native Build (Phase 2)

on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - 'lisp/loadup.el'
      - '.github/workflows/build-zig-native.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - 'lisp/loadup.el'
      - '.github/workflows/build-zig-native.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        mode: [Debug, ReleaseFast]
        exclude:
          # Windows ReleaseFast can be slow, skip in CI
          - os: windows-latest
            mode: ReleaseFast

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify Zig installation
        run: zig version

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            autoconf automake \
            texinfo \
            libgnutls28-dev \
            libncurses5-dev \
            libxml2-dev \
            zlib1g-dev \
            liblcms2-dev \
            libsqlite3-dev \
            libgmp-dev \
            libacl1-dev \
            libselinux1-dev \
            libtree-sitter-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config autoconf automake gnutls libxml2 little-cms2 sqlite3

      # Windows now builds the full executable (w32 console modules are
      # wired in); the cross platform zig package layer is still covered
      # by the zig-verify workflow.
      - name: Build (TUI mode)
        run: zig build -Doptimize=${{ matrix.mode }}
        shell: bash

      # Diagnostic for the Windows loadup failure: run the exact dump
      # command the build pipeline runs and capture its output, so a
      # silent early exit becomes visible in the log.
      - name: Diagnose Windows loadup
        if: runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          cd zig-out\bin
          set EMACSLOADPATH=%CD%\..\..\lisp
          set EMACSDATA=%CD%\..\..\etc
          set LC_ALL=C
          .\temacs.exe -batch -l loadup --temacs=pbootstrap > dump_out.txt 2>&1
          echo DUMP_EXIT=%errorlevel%
          type dump_out.txt

      - name: Verify temacs executable
        run: |
          if [ -f zig-out/bin/temacs ]; then
            echo "✓ temacs built successfully"
            file zig-out/bin/temacs || true
          elif [ -f zig-out/bin/temacs.exe ]; then
            echo "✓ temacs.exe built successfully"
            file zig-out/bin/temacs.exe || true
          else
            echo "✗ temacs/temacs.exe not found"
            exit 1
          fi
        shell: bash

      - name: Run tests
        run: zig build test
        shell: bash
        continue-on-error: true

      - name: Basic functional test
        run: |
          if [ -f ./zig-out/bin/temacs.exe ]; then
            # Explicit dump file: the default-search path is the build
            # tree's lib-src (PATH_EXEC), not the executable directory.
            ./zig-out/bin/temacs.exe --batch --dump-file=./zig-out/bin/bootstrap-emacs.pdmp --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          else
            ./zig-out/bin/temacs --batch --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          fi
        shell: bash

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'ReleaseFast'
        uses: actions/upload-artifact@v4
        with:
          name: emacs-zig-linux-x86_64
          path: |
            zig-out/bin/temacs
            emacs.pdump
          retention-days: 7

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest' && matrix.mode == 'ReleaseFast'
        uses: actions/upload-artifact@v4
        with:
          name: emacs-zig-macos-universal
          path: |
            zig-out/bin/temacs
            emacs.pdump
          retention-days: 7

      - name: Upload Windows diagnostics
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diag-${{ matrix.mode }}
          path: |
            zig-out/bin/temacs.exe
            zig-out/bin/temacs.pdb
          retention-days: 3
