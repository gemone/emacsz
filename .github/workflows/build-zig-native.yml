name: Zig Native Build (Phase 2)

# Cross-platform native builds. Linux is NOT built here: the authoritative
# Linux gate (full build + 582 ert tests) lives in zig-verify.yml, so a
# Linux job here would only duplicate ~60 min of work per mode. This
# workflow covers the platforms an ubuntu runner cannot reach: native macOS
# (the macOS SDK/frameworks) and native Windows (the w32 build + smoke).
on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - 'lisp/loadup.el'
      - '.github/workflows/build-zig-native.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - 'lisp/loadup.el'
      - '.github/workflows/build-zig-native.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is covered by zig-verify.yml (same `zig build test` chain);
        # building it here too just burns ~60 min/job of redundant work.
        os: [macos-latest, windows-latest]
        mode: [Debug, ReleaseFast]
        exclude:
          # Windows ReleaseFast can be slow, skip in CI
          - os: windows-latest
            mode: ReleaseFast

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify Zig installation
        run: zig version

      # Cache the Zig build cache plus the generated source-tree artifacts
      # (byte-compiled .elc, generated Unicode/charset data, dumps). With a
      # warm cache Zig skips the expensive lisp-bootstrap pipeline
      # (dump -> byte-compile ~1600 files -> re-dump) that dominates CI
      # time, and byte-recompile-directory's mtime check recompiles only
      # the .el files that actually changed. (bootstrap-dump scrubs only
      # loaddefs, never .elc, so restoring .elc is safe.)
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            lisp/**/*.elc
            lisp/loaddefs.el
            lisp/**/*-loaddefs.el
            lisp/international/charprop.el
            lisp/international/charscript.el
            lisp/international/emoji-zwj.el
            lisp/international/uni-*.el
            lisp/international/cp51932.el
            lisp/international/eucjp-ms.el
            etc/charsets
            etc/DOC
            zig-out/bin/*.pdmp
          key: zigbuild-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build-aux/**', 'tools/**') }}-v1
          restore-keys: |
            zigbuild-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build-aux/**', 'tools/**') }}-
            zigbuild-${{ runner.os }}-${{ matrix.mode }}-
            zigbuild-${{ runner.os }}-

      # Windows now builds the full executable (w32 console modules are
      # wired in); the cross platform zig package layer is still covered
      # by the zig-verify workflow.
      - name: Build (TUI mode)
        run: zig build -Doptimize=${{ matrix.mode }}
        shell: bash

      - name: Verify temacs executable
        run: |
          if [ -f zig-out/bin/temacs ]; then
            echo "✓ temacs built successfully"
            file zig-out/bin/temacs || true
          elif [ -f zig-out/bin/temacs.exe ]; then
            echo "✓ temacs.exe built successfully"
            file zig-out/bin/temacs.exe || true
          else
            echo "✗ temacs/temacs.exe not found"
            exit 1
          fi
        shell: bash

      - name: Run tests
        env:
          ZIG_COMPILE_LISP_PROBE: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          # GitHub macOS runners sandbox the step process: creating files
          # works, but writing to an existing file is denied both in /tmp
          # and in RUNNER_TEMP (file-write-data), which fails e.g. the
          # check-declare ert tests that open their temp file for
          # writing.  The workspace (zig-out is gitignored) is writable
          # for existing files, so point TMPDIR there.
          mkdir -p "${PWD}/zig-out/tmp"
          export TMPDIR="${PWD}/zig-out/tmp"
          zig build test
        shell: bash

      - name: Basic functional test
        run: |
          if [ -f ./zig-out/bin/temacs.exe ]; then
            # Explicit dump file: the default-search path is the build
            # tree's lib-src (PATH_EXEC), not the executable directory.
            ./zig-out/bin/temacs.exe --batch --dump-file=./zig-out/bin/bootstrap-emacs.pdmp --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          else
            ./zig-out/bin/temacs --batch --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          fi
        shell: bash

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest' && matrix.mode == 'ReleaseFast'
        uses: actions/upload-artifact@v4
        with:
          name: emacs-zig-macos-universal
          path: |
            zig-out/bin/temacs
            emacs.pdump
          retention-days: 7
