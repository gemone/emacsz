name: Build Emacs with Zig

on:
  push:
    branches: [ main, master, zig-build* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.15.2"

jobs:
  build:
    name: Build Emacs on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            zig_target: aarch64-macos-none
            optimize: ReleaseFast

          - os: macos-intel
            runner: macos-13
            zig_target: x86_64-macos-none
            optimize: ReleaseFast

          - os: linux
            runner: ubuntu-latest
            zig_target: x86_64-linux-gnu
            optimize: ReleaseFast

          - os: linux-arm64
            runner: ubuntu-latest
            zig_target: aarch64-linux-gnu
            optimize: ReleaseFast

          - os: windows
            runner: windows-latest
            zig_target: x86_64-windows-gnu
            optimize: ReleaseFast

    steps:
      - name: Checkout Emacs repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: actions/setup-zig@v3
        with:
          version: 0.15.2

      - name: Verify Zig installation
        run: |
          zig version
          zig env

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libjpeg-turbo libpng giflib

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxpm-dev libjpeg-dev \
            libpng-dev libgif-dev libtiff5-dev \
            libgnutls28-dev libncurses5-dev \
            libgtk-3-dev libxft-dev librsvg2-dev

      - name: Build Emacs with Zig
        run: |
          zig build -Doptimize=${{ matrix.optimize }}

      - name: Verify build output
        run: |
          ls -lh zig-out/bin/temacs

      - name: Test - Basic Lisp evaluation
        run: |
          ./zig-out/bin/temacs --batch --eval "(progn (message \"Hello from Zig-built Emacs on ${{ matrix.os }}!\") (message \"Version: %s\" emacs-version) (kill-emacs))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emacs-${{ matrix.os }}-zig-${{ github.sha }}
          path: zig-out/
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary for ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Zig Target**: ${{ matrix.zig_target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Optimize**: ${{ matrix.optimize }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "zig-out/bin/temacs" ]; then
            echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
            ls -lh zig-out/bin/temacs >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Full Test Suite on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.runner }}
    if: success()
    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: linux
            runner: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: emacs-${{ matrix.os }}-zig-${{ github.sha }}
          path: zig-out/

      - name: Make binary executable
        run: |
          chmod +x zig-out/bin/temacs

      - name: Run full test suite with Zig
        run: |
          zig build test

      - name: Upload test results
        if: always()
        run: |
          echo "## Test Results: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full test suite executed via zig build test" >> $GITHUB_STEP_SUMMARY
