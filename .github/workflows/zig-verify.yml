name: Zig Verify (Build, Tests, Cross-Compile)

# CI verification for the pure-zig build: native Linux gate (full build +
# all built-in ert tests) and cross-compile checks for every target the
# build claims to support. Cross targets are verified at compile level
# (all Zig packages and C sources); the final link is only expected to
# succeed where the target's system libraries exist on the runner.

on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/zig-verify.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/zig-verify.yml'
  workflow_dispatch:

jobs:
  # Native gate: the authoritative Linux verification. `zig build check`
  # builds temacs and runs all 582 built-in ert tests; it is a hard gate
  # (the native matrix workflow in build-zig-native.yml hard-gates the
  # same `zig build test` chain on Ubuntu, macOS and Windows).
  linux-check:
    name: Linux build + 582 ert tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      - name: Build
        run: zig build

      - name: Built-in ert tests
        run: zig build check

  # Cross-compile verification.  Windows and musl now link fully (w32
  # console modules; static musl with no system libraries), so their
  # `zig build -Dtarget=...` runs are hard gates.  Only macOS keeps the
  # link-only classification: a Linux host cannot find the macOS system
  # libraries (gnutls/ncurses/...), so a link failure of that shape is
  # reported as a notice while every Zig package and C source must
  # compile.  The native Windows runner (full build + temacs.exe smoke
  # test) lives in build-zig-native.yml.
  cross-compile:
    name: Compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos
          - aarch64-linux-musl
          - x86_64-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install host headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgnutls28-dev

      - name: Cross-compile check
        shell: bash
        run: |
          set +e
          out="$(zig build -Dtarget="${{ matrix.target }}" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice::zig build -Dtarget=${{ matrix.target }} linked successfully"
            exit 0
          fi
          # Windows and musl link fully; any failure there is real.
          if [ "${{ matrix.target }}" = "x86_64-windows-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-linux-musl" ] || \
             [ "${{ matrix.target }}" = "aarch64-linux-musl" ]; then
            printf '%s\n' "$out"
            echo "::error::zig build -Dtarget=${{ matrix.target }} failed"
            exit 1
          fi
          # Expected failure shape: the final exe link needs the target's
          # system libraries, which are not installed on a Linux host.
          # macOS cross links also need the target's frameworks (gnutls
          # links Security/CoreFoundation), which a Linux host cannot
          # resolve; treat that the same as a missing system library.
          if printf '%s\n' "$out" | grep -qE "unable to find (dynamic system library|framework)"; then
            real="$(printf '%s\n' "$out" | grep -E "error:" | \
              grep -vE "unable to find (dynamic system library|framework)|process exited with error code|the following build command failed" || true)"
            if [ -n "$real" ]; then
              printf '%s\n' "$real"
              echo "::error::compile errors for ${{ matrix.target }}"
              exit 1
            fi
            echo "::notice::all Zig packages and C sources compiled for ${{ matrix.target }}; final link needs target system libraries unavailable on this host"
            exit 0
          fi
          printf '%s\n' "$out"
          echo "::error::zig build -Dtarget=${{ matrix.target }} failed"
          exit 1

  # Full suite sweep (all 484 discovered suites, per-suite timeout) is
  # long; run it on demand or nightly rather than on every push.
  check-all:
    name: Full suite sweep (484 suites)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      - name: Full suite sweep
        env:
          CHECK_ALL_TIMEOUT: 600
        run: zig build check-all
