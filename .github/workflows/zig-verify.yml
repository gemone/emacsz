name: Zig Verify (Build, Tests, Cross-Compile)

# CI verification for the pure-zig build: native Linux gate (full build +
# all built-in ert tests) and cross-compile checks for every target the
# build claims to support. Cross targets are verified at compile level
# (all Zig packages and C sources); the final link is only expected to
# succeed where the target's system libraries exist on the runner.

on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/zig-verify.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/zig-verify.yml'
  workflow_dispatch:

jobs:
  # Native gate: the authoritative Linux verification. `zig build check`
  # builds temacs and runs all 582 built-in ert tests; it is a hard gate
  # (unlike the artifact matrix workflow, which keeps tests informational).
  linux-check:
    name: Linux build + 582 ert tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libxml2-dev \
            zlib1g-dev \
            liblcms2-dev \
            libsqlite3-dev \
            libgmp-dev \
            libacl1-dev \
            libselinux1-dev \
            libtree-sitter-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      - name: Build
        run: zig build

      - name: Built-in ert tests
        run: zig build check

  # Cross-compile verification.  On a Linux host the final link cannot
  # find non-Linux system libraries (gmp/gnutls/ncurses/...), so for
  # macOS and musl a link-only failure of that shape is reported as a
  # notice while every Zig package and C source must compile.  Native
  # Windows is not ported at the C-source level yet: the authoritative
  # gate there is `zig build zig-packages` (every independent Zig
  # package compiles for the target), with the full build reported
  # informationally.
  cross-compile:
    name: Compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos
          - aarch64-linux-musl
          - x86_64-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install host headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libgnutls28-dev \
            liblcms2-dev \
            libsqlite3-dev \
            libgmp-dev

      # Windows: hard gate on the Zig package layer (all gnulib and
      # os-layer packages compile for the target).  The C-source Windows
      # port (mingw headers, Windows gmp/gnutls/zlib/...) is not done
      # yet, so the full build below is informational only.
      - name: Zig package layer compile check (Windows)
        if: matrix.target == 'x86_64-windows-gnu'
        run: zig build zig-packages -Dtarget=${{ matrix.target }}

      - name: Cross-compile check
        if: matrix.target != 'x86_64-windows-gnu'
        shell: bash
        run: |
          set +e
          out="$(zig build -Dtarget="${{ matrix.target }}" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice::zig build -Dtarget=${{ matrix.target }} linked successfully"
            exit 0
          fi
          # Expected failure shape: the final exe link needs the target's
          # system libraries, which are not installed on a Linux host.
          if printf '%s\n' "$out" | grep -q "unable to find dynamic system library"; then
            real="$(printf '%s\n' "$out" | grep -E "error:" | \
              grep -vE "unable to find dynamic system library|process exited with error code|the following build command failed" || true)"
            if [ -n "$real" ]; then
              printf '%s\n' "$real"
              echo "::error::compile errors for ${{ matrix.target }}"
              exit 1
            fi
            echo "::notice::all Zig packages and C sources compiled for ${{ matrix.target }}; final link needs target system libraries unavailable on this host"
            exit 0
          fi
          printf '%s\n' "$out"
          echo "::error::zig build -Dtarget=${{ matrix.target }} failed"
          exit 1

      # Windows full build status: report the C-layer blockers without
      # failing the gate (the package layer above is authoritative).
      - name: Full build status (Windows, informational)
        if: matrix.target == 'x86_64-windows-gnu'
        shell: bash
        run: |
          set +e
          out="$(zig build -Dtarget="${{ matrix.target }}" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice::full zig build linked for x86_64-windows-gnu"
            exit 0
          fi
          printf '%s\n' "$out" | \
            grep -E "^[^ ]+\.(c|h|zig):[0-9]+:[0-9]+: error" | \
            sort -u | head -15 || true
          echo "::notice::full Windows build is blocked by the C-source port (mingw/gnutls/gmp headers); the Zig package layer gate above is authoritative"

  # Full suite sweep (all 484 discovered suites, per-suite timeout) is
  # long; run it on demand or nightly rather than on every push.
  check-all:
    name: Full suite sweep (484 suites)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libxml2-dev \
            zlib1g-dev \
            liblcms2-dev \
            libsqlite3-dev \
            libgmp-dev \
            libacl1-dev \
            libselinux1-dev \
            libtree-sitter-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      - name: Full suite sweep
        env:
          CHECK_ALL_TIMEOUT: 600
        run: zig build check-all
