name: Sync Upstream Emacs

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday 00:00 UTC (08:00 Beijing)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream-master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upstream-master

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream (GNU Emacs)
        run: |
          git remote add upstream git://git.sv.gnu.org/emacs.git || true
          git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master)
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.check.outputs.has_updates == 'true'
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline --no-merges HEAD..upstream/master | head -50)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create sync branch
        if: steps.check.outputs.has_updates == 'true'
        id: branch
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"
          git merge upstream/master --no-edit
          git push origin "$BRANCH"

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base upstream-master \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "Sync with GNU Emacs master ($(date +%Y-%m-%d))" \
            --body "## Summary

          Sync upstream-master with GNU Emacs master.

          ## Changes

          \`\`\`
          ${{ steps.changelog.outputs.changelog }}
          \`\`\`

          ---

          *This PR was automatically generated by the weekly sync workflow.*"
