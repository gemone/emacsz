name: CI (zig build)

# Pure-`zig build` workflow.  One job per platform (Linux / macOS / Windows)
# builds the ReleaseFast binary ONCE, then runs smoke + the full test suite
# (582 ert tests + the .zeln native-comp gates) against that same Release
# binary, and uploads the binaries.
#
# Why a single job per platform:
#   * ReleaseFast only -- Debug is dropped, so the matrix is 3 jobs (one per
#     OS), not 3 x {ReleaseFast,Debug}.
#   * The test suite reuses the Release build already in the workspace instead
#     of rebuilding from a cold checkout.  Every step after `Build` passes
#     `-Doptimize=ReleaseFast`, so the in-workspace zig build cache makes the
#     compile/dump steps a cache hit -- only the loaddefs-final + test runner
#     actually execute.  (A separate `test` job would start from a fresh
#     checkout and rebuild everything again.)
#
# Shell: Windows builds under PowerShell (pwsh) -- the native Windows shell --
# so `zig build` runs with the real Windows PATH and no Git-Bash/MSYS path
# translation; Linux/macOS use bash.  Env vars are passed via step `env:`
# blocks (or $GITHUB_ENV) rather than inline `VAR=val cmd` prefixes, which
# are bash-only.
#
# No make, no ./configure, no shell step: `zig build` is the sole build system
# (src/config.h is a first-class b.addConfigHeader artifact).

on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'config-overrides.zig'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'config-overrides.zig'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      # Zig's GLOBAL cache (toolchain lib + downloaded dependency packages)
      # lives in a per-platform dir; this is the cheap, high-hit-rate thing
      # to persist across runs.  The repo-local .zig-cache is large and
      # misses on every fresh commit, so we don't cache it.  Windows
      # runner LOCALAPPDATA is fixed at C:\Users\runneradmin\AppData\Local.
      ZIG_GLOBAL_CACHE: ${{ matrix.os == 'windows-latest' && 'C:\Users\runneradmin\AppData\Local\zig' || (matrix.os == 'macos-latest' && '~/Library/Caches/org.ziglang.zig' || '~/.cache/zig') }}
    defaults:
      run:
        # Native shell per OS: PowerShell on Windows, bash elsewhere.  Use
        # matrix.os (not runner.os): the `runner` context is unavailable at
        # the job-defaults level, but `matrix` is.
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # Restore the zig global cache.  A cache-service hiccup must not fail
      # the build, so restore is best-effort (continue-on-error).
      - name: Restore zig global cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-${{ matrix.os }}-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}
          restore-keys: |
            zig-global-${{ matrix.os }}-

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          GCC_MAJOR="$(gcc -dumpversion | cut -d. -f1)"
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev \
            "libgccjit-${GCC_MAJOR}-dev"

      # Build the deterministic pure-zeln baseline once in ReleaseFast.
      # Pin gccjit OFF: the combined build is a separate, later gate.  Keep
      # -Dnative-comp=false on every baseline command; omitting it would let
      # the newly installed libgccjit flip auto-on and invalidate the graph.
      - name: Build
        run: zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast

      # Verify + smoke: the binary name and dump handling differ per OS, so
      # run each in its native shell.  The --eval arg is single-quoted so the
      # inner double quotes survive verbatim in both bash and pwsh.
      - name: Verify & smoke (Unix)
        if: runner.os != 'Windows'
        run: |
          test -f zig-out/bin/temacs || { echo '✗ temacs not found'; exit 1; }
          echo '✓ temacs built successfully'
          ./zig-out/bin/temacs --batch --eval '(progn (message "Zig build working!") (kill-emacs 0))'

      - name: Verify & smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'zig-out/bin/temacs.exe')) {
            Write-Host '✗ temacs.exe not found'; exit 1
          }
          Write-Host '✓ temacs.exe built successfully'
          # Explicit dump file: the default-search path is the build tree's
          # lib-src (PATH_EXEC), not the executable directory.
          ./zig-out/bin/temacs.exe --batch --dump-file=./zig-out/bin/bootstrap-emacs.pdmp --eval '(progn (message "Zig build working!") (kill-emacs 0))'

      # Upload right after a successful build+smoke, so the Release binary is
      # captured even if a later test step fails.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: emacs-zig-${{ matrix.os }}-bin
          path: |
            zig-out/bin/temacs
            zig-out/bin/temacs.exe
            zig-out/bin/bootstrap-emacs.pdmp
          retention-days: 7

      # GitHub macOS runners sandbox the step process: creating files works,
      # but writing to an existing file is denied in /tmp and RUNNER_TEMP
      # (file-write-data), which fails e.g. the check-declare ert tests.
      # The workspace (zig-out is gitignored) is writable for existing files,
      # so point TMPDIR there -- exported via $GITHUB_ENV so it only takes
      # effect on macOS and never leaks onto Linux/Windows.
      - name: Point TMPDIR at the workspace (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zig-out/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/zig-out/tmp" >> "$GITHUB_ENV"

      - name: Built-in ert tests (582)
        env:
          ZIG_COMPILE_LISP_PROBE: ${{ runner.os == 'Windows' && '1' || '' }}
        timeout-minutes: 90
        run: zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast check

      # .zeln native-comp feature tests, identical on all three platforms.
      # ZELN_PGO_HAMMER is set in the step env (shell-agnostic) instead of the
      # bash-only `VAR=val cmd` prefix; only zeln-pgo reads it.
      #
      # Hard gate on ALL platforms: no continue-on-error.
      - name: .zeln AOT feature tests (populate + gate #2 + zeln-diff + pgo)
        env:
          ZELN_PGO_HAMMER: '30000'
          # Shrink the per-batch/standalone byte-compile watchdog from the
          # 600s default: a single test-file byte-compile has been observed to
          # hang on the 2-vCPU windows runner (environmental; compiles in ~2s
          # locally), so detect it early and defer/skip instead of spending 20
          # minutes per hung file.  The .zeln coverage floor still gates.
          ZELN_BC_TIMEOUT: '120'
        # Hard bound for genuinely-stuck runs.  The historical 180-minute
        # budget was silently burned by a Defender-induced finder-inf.el
        # overwrite hang; generate-loaddefs now skips rewriting an existing
        # finder-inf.el, so that wedge is gone.  The step still needs a wide
        # bound on Windows: populate-zeln-cache native-compiles ~2300 .elc via
        # zig-cc and takes well over 30 min on the 2-vCPU runner even healthy.
        # Linux/macOS finish the whole step in ~6 min.
        timeout-minutes: 90
        run: |
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast populate-zeln-cache &&
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast check-zeln &&
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-diff &&
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-pgo

      # The in-process JIT emitter is x86-64-only.  Keep the AOT matrix
      # platform-uniform above, but gate the JIT only where it can execute.
      # Pin gccjit OFF so the suite exercises the zeln JIT itself rather
      # than a host-dependent combined eln+zeln configuration.
      - name: .zeln JIT gates (smoke + full suite)
        if: runner.arch == 'X64'
        timeout-minutes: 90
        run: |
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-jit-smoke &&
          zig build -Dnative-comp=false -Dnative-comp-zig=true -Doptimize=ReleaseFast check-zeln-jit

      # Combined-path behavior is meaningful only where libgccjit is
      # supported: a .zeln must expose the same native-comp introspection
      # surface as a .eln when both backends are compiled in, and loader
      # preference must remain deterministic in both directions.  The
      # versioned Ubuntu package above is chosen from the host compiler so
      # the explicit -Dnative-comp=true command cannot silently degrade.
      - name: Combined eln + zeln metadata smoke (Linux)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        timeout-minutes: 30
        run: |
          zig build -Dnative-comp=true -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-jit-smoke &&
          zig build -Dnative-comp=true -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-interop-smoke

      # Persist the zig global cache for the next run.  Always runs (even on
      # a late step failure) and must not fail the job (cache-service 4xx
      # is transient and non-fatal).
      - name: Save zig global cache
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-${{ matrix.os }}-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}

  # MSVC backend (acceptance 5.3 / objective 3.4): a second Windows job that
  # builds and tests with -Dtarget=x86_64-windows-msvc.  The windows-latest
  # runner ships Visual Studio Build Tools + Windows SDK preinstalled, which
  # the MSVC ABI requires.  Kept as its own job so the default GNU matrix
  # above is untouched and stays green; a missing toolchain surfaces via
  # zig's own WindowsSdkNotFound rather than a hard-coded path probe.
  build-and-test-msvc:
    name: windows-latest (MSVC ABI)
    runs-on: windows-latest
    env:
      ZIG_GLOBAL_CACHE: C:\Users\runneradmin\AppData\Local\zig
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore zig global cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-msvc-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}
          restore-keys: |
            zig-global-msvc-

      # MSVC backend build.  -Dnative-comp-zig=true is set from the start
      # (mirroring the GNU job) so the ert and .zeln steps below reuse this
      # exact build via the in-workspace cache instead of forcing a second
      # full rebuild on the flag flip.  build.zig's host_can_run_target lets
      # a Windows host run the dump for the msvc target, so the install
      # produces bootstrap-emacs.pdmp here just as it does for GNU.
      - name: Build (MSVC)
        run: zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true

      - name: Verify & smoke (MSVC)
        run: |
          foreach ($bin in 'temacs.exe','emacs.exe','emacsclient.exe','etags.exe') {
            if (-not (Test-Path "zig-out/bin/$bin")) {
              Write-Host "✗ $bin not found"; exit 1
            }
          }
          Write-Host '✓ MSVC build produced all four binaries'
          # With host_can_run_target (build.zig), a Windows host runs the
          # dump for the msvc target too, so the pdmp should exist; keep the
          # tool-only branch as a visible fallback.
          if (Test-Path 'zig-out/bin/bootstrap-emacs.pdmp') {
            Write-Host '✓ MSVC dump present; smoke the dumped emacs'
            ./zig-out/bin/emacs.exe --no-site-file --no-init-file --batch --eval '(princ (format "msvc %s\n" emacs-version))'
          } else {
            Write-Host 'ℹ no dump (unexpected): verifying via etags/emacsclient'
            ./zig-out/bin/etags.exe --version
            ./zig-out/bin/emacsclient.exe --version
          }

      # Full ert suite for the MSVC backend.  The check pipeline runs the
      # dump itself (bootstrap-dump -> compile-lisp -> dump-compiled ->
      # loaddefs -> run-check) and is NOT gated on is_native_target, so it
      # executes the msvc-ABI temacs on this Windows host.  Verified locally:
      # 132 tests, 0 unexpected, EXIT=0 (ReleaseFast + native-comp-zig=true).
      - name: Built-in ert tests (MSVC)
        timeout-minutes: 90
        run: zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true check

      # .zeln native-comp feature tests for the MSVC backend, mirroring the
      # GNU job's four steps with the msvc target.  HAVE__SETJMP=1 (config-
      # overrides.zig) makes sys_longjmp a direct register restore on MSVC,
      # so handler-carrying units compile natively and the coverage floor
      # passes without an msvc exemption; the JIT UNWIND_CODE encoding fix
      # keeps the JIT smoke green.  No continue-on-error: MSVC is now a
      # hard gate like Linux/macOS.
      - name: .zeln AOT feature tests (MSVC)
        env:
          ZELN_PGO_HAMMER: '30000'
          ZELN_BC_TIMEOUT: '120'
        timeout-minutes: 90
        run: |
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true populate-zeln-cache &&
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true check-zeln &&
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true zeln-diff &&
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true zeln-pgo

      - name: .zeln JIT gates (MSVC)
        if: runner.arch == 'X64'
        timeout-minutes: 90
        run: |
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true zeln-jit-smoke &&
          zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dnative-comp=false -Dnative-comp-zig=true check-zeln-jit

      - name: Save zig global cache (MSVC)
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-msvc-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}

  # Full w32 GUI backend (-Dgui with the vendored image decoders) on BOTH
  # Windows ABIs.  Builds the GUI emacs and verifies the frame + image
  # surface: a batch probe checks system-configuration, (featurep 'w32)
  # and image-type-available-p for png/jpeg/tiff.  The GUI frame itself
  # needs an interactive desktop session, which this headless job cannot
  # provide, so the C-level proof is the full compile+link of the
  # W32_OBJ/WINDOW_SYSTEM_OBJ module set (verified frame+decode locally).
  gui-build:
    name: GUI ${{ matrix.abi }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ gnu, msvc ]
    env:
      ZIG_GLOBAL_CACHE: C:\Users\runneradmin\AppData\Local\zig
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore zig global cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-gui-${{ matrix.abi }}-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}
          restore-keys: |
            zig-global-gui-${{ matrix.abi }}-
            zig-global-windows-latest-

      # -Dgui + the three vendored image decoders; a SEPARATE cache dir so
      # the GUI config/header generation cannot pollute the console jobs.
      - name: Build GUI emacs
        run: >
          zig build -Dgui -Dwith-png -Dwith-jpeg -Dwith-tiff
          -Doptimize=ReleaseFast
          ${{ matrix.abi == 'msvc' && '-Dtarget=x86_64-windows-msvc' || '' }}
          --cache-dir .zig-cache-gui

      # Batch probe (headless-safe): the w32 backend must be registered and
      # all three vendored decoders available.
      - name: Verify w32 + image surface
        run: |
          $probe = @'
          (progn
            (princ (format "conf=%S w32=%S png=%S jpeg=%S tiff=%S"
                           system-configuration
                           (featurep 'w32)
                           (image-type-available-p 'png)
                           (image-type-available-p 'jpeg)
                           (image-type-available-p 'tiff)))
            (kill-emacs (if (and (featurep 'w32)
                                  (image-type-available-p 'png)
                                  (image-type-available-p 'jpeg)
                                  (image-type-available-p 'tiff))
                            0 1)))
          '@
          Set-Content gui-probe.el $probe
          & .\zig-out\bin\emacs.exe --no-init-file --no-site-file --batch `
            --dump-file=.\zig-out\bin\bootstrap-emacs.pdmp `
            --load "$PWD\gui-probe.el"
          if ($LASTEXITCODE -ne 0) { throw "GUI probe failed (exit $LASTEXITCODE)" }

      - name: Save zig global cache (GUI)
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE }}
          key: zig-global-gui-${{ matrix.abi }}-${{ hashFiles('build.zig.zon', 'tools/**/build.zig.zon') }}
