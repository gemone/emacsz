name: CI (zig build)

# Pure-`zig build` workflow.  One job per platform (Linux / macOS / Windows)
# builds the ReleaseFast binary ONCE, then runs smoke + the full test suite
# (582 ert tests + the .zeln native-comp gates) against that same Release
# binary, and uploads the binaries.
#
# Why a single job per platform:
#   * ReleaseFast only -- Debug is dropped, so the matrix is 3 jobs (one per
#     OS), not 3 x {ReleaseFast,Debug}.
#   * The test suite reuses the Release build already in the workspace instead
#     of rebuilding from a cold checkout.  Every step after `Build` passes
#     `-Doptimize=ReleaseFast`, so the in-workspace zig build cache makes the
#     compile/dump steps a cache hit -- only the loaddefs-final + test runner
#     actually execute.  (A separate `test` job would start from a fresh
#     checkout and rebuild everything again.)
#
# No make, no ./configure, no shell step: `zig build` is the sole build system
# (src/config.h is a first-class b.addConfigHeader artifact).

on:
  push:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'config-overrides.zig'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main, zig-build-* ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'config-overrides.zig'
      - 'tools/**'
      - 'src/**'
      - 'lib/**'
      - 'build-aux/**'
      - 'etc/**'
      - 'test/**'
      - 'lisp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      # Build ONCE in ReleaseFast.  Every later step passes
      # -Doptimize=ReleaseFast so it reuses this exact build via the
      # in-workspace zig cache instead of rebuilding.
      - name: Build
        run: zig build -Doptimize=ReleaseFast
        shell: bash

      - name: Verify temacs executable
        run: |
          if [ -f zig-out/bin/temacs ]; then
            echo "✓ temacs built successfully"
            file zig-out/bin/temacs || true
          elif [ -f zig-out/bin/temacs.exe ]; then
            echo "✓ temacs.exe built successfully"
            file zig-out/bin/temacs.exe || true
          else
            echo "✗ temacs/temacs.exe not found"
            exit 1
          fi
        shell: bash

      - name: Smoke test
        run: |
          if [ -f ./zig-out/bin/temacs.exe ]; then
            # Explicit dump file: the default-search path is the build
            # tree's lib-src (PATH_EXEC), not the executable directory.
            ./zig-out/bin/temacs.exe --batch --dump-file=./zig-out/bin/bootstrap-emacs.pdmp --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          else
            ./zig-out/bin/temacs --batch --eval "(progn (message \"Zig build working!\") (kill-emacs 0))"
          fi
        shell: bash

      # Upload right after a successful build+smoke, so the Release binary is
      # captured even if a later test step fails.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: emacs-zig-${{ matrix.os }}-bin
          path: |
            zig-out/bin/temacs
            zig-out/bin/temacs.exe
            zig-out/bin/bootstrap-emacs.pdmp
          retention-days: 7

      - name: Built-in ert tests (582)
        env:
          ZIG_COMPILE_LISP_PROBE: ${{ runner.os == 'Windows' && '1' || '' }}
        timeout-minutes: 90
        run: |
          # GitHub macOS runners sandbox the step process: creating files
          # works, but writing to an existing file is denied both in /tmp
          # and in RUNNER_TEMP (file-write-data), which fails e.g. the
          # check-declare ert tests that open their temp file for writing.
          # The workspace (zig-out is gitignored) is writable for existing
          # files, so point TMPDIR there.
          mkdir -p "${PWD}/zig-out/tmp"
          export TMPDIR="${PWD}/zig-out/tmp"
          zig build -Doptimize=ReleaseFast check
        shell: bash

      # .zeln native-comp feature tests.  Run identically on all three
      # platforms so the feature surface stays uniform.  -Doptimize=ReleaseFast
      # keeps them on the same build as the rest of the job.
      - name: .zeln feature tests (populate + gate #2 + zeln-diff + pgo)
        timeout-minutes: 120
        run: |
          zig build -Dnative-comp-zig=true -Doptimize=ReleaseFast populate-zeln-cache
          zig build -Dnative-comp-zig=true -Doptimize=ReleaseFast check-zeln
          zig build -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-diff
          ZELN_PGO_HAMMER=30000 zig build -Dnative-comp-zig=true -Doptimize=ReleaseFast zeln-pgo
        shell: bash
