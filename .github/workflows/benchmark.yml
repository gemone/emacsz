name: Zeln Benchmark (3-platform, identical content)

# Complete performance comparison on the REAL test/ ert suites, running the
# SAME content on all three platforms simultaneously: the same 582 built-in
# tests run under the original interpreter (baseline) vs transparent .zeln
# loading; bench-tests reports the best-of-3 wall-clock ratio.  The .zeln
# pipeline (compz.c + zeln-compile + populate + bench-check) is enabled on
# every native OS since the gate lift (build.zig: native, non-musl), so
# Linux / macOS / Windows all run the identical steps.
# Runs when a version is merged (push to the default branch = the merge
# event) and on demand via workflow_dispatch.

on:
  push:
    branches: [master, main]
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "tools/**"
      - "src/**"
      - "build-aux/**"
      - "lisp/**"
      - "test/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

# Least-privilege: this job only reads the repo and writes its own summary.
permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # System libraries are a platform necessity, not benchmark content:
      # Linux needs the apt dev packages; macOS/Windows runners carry what
      # the build needs already.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      # Warm build cache: the dump chain (dump -> byte-compile ~1600 files
      # -> re-dump) dominates cold CI time; the cache restores the .elc and
      # generated data so only changed files recompile.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            lisp/**/*.elc
            test/**/*.elc
            lisp/loaddefs.el
            lisp/**/*-loaddefs.el
            lisp/international/charprop.el
            lisp/international/charscript.el
            lisp/international/emoji-zwj.el
            lisp/international/uni-*.el
            lisp/international/cp51932.el
            lisp/international/eucjp-ms.el
            etc/charsets
            etc/DOC
            zig-out/bin/*.pdmp
          key: zigbuild-bench-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build-aux/**', 'tools/**') }}-v1
          restore-keys: |
            zigbuild-bench-${{ runner.os }}-
            zigbuild-bench-
            zigbuild-Linux-native-

      # ---- The IDENTICAL benchmark content on all three platforms. ----
      # 1. Full build (the default install puts the flag-correct temacs into
      #    zig-out/bin; step-specific builds do not reinstall it).
      - name: Build (.zeln path)
        shell: bash
        run: zig build -Dnative-comp-zig=true

      # 2. Populate the .zeln cache over BOTH the lisp and test trees.
      - name: Populate .zeln cache (lisp + test tree)
        shell: bash
        timeout-minutes: 45
        run: zig build -Dnative-comp-zig=true populate-zeln-cache

      # 3. The complete performance comparison: real 582-test suite, original
      #    interpreter as baseline vs .zeln loading, best-of-3 each.  Tee the
      #    summary line to a log for the job summary step.
      - name: Benchmark (real suite, interpreter baseline vs .zeln)
        shell: bash
        timeout-minutes: 60
        run: |
          zig build -Dnative-comp-zig=true bench-check 2>&1 | \
            tee "${{ runner.temp }}/bench.log"

      # 4. Report the same ratio from every platform.
      - name: Summarize
        shell: bash
        run: |
          LINE=$(grep -a "bench-tests: ert suite" "${{ runner.temp }}/bench.log" | tail -1 || true)
          echo "bench_line=$LINE" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.os }} — Zeln Benchmark (real 582-test suite)"
            echo ""
            echo "Interpreter baseline vs .zeln loading, best-of-3:"
            echo ""
            if [ -n "$LINE" ]; then
              echo "\`$LINE\`"
              echo ""
              echo "Ratio convention: zeln/interp < 1 means the .zeln path is faster"
              echo "than the original interpreter on the full real test suite."
            else
              echo "benchmark run failed — see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
