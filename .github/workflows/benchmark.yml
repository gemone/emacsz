name: Zeln Benchmark (real test suites)

# Complete performance comparison on the REAL test/ ert suites: the same
# 582 built-in tests run under the original interpreter (baseline) and
# under transparent .zeln loading; bench-tests reports the best-of-3
# wall-clock ratio.  Runs when a version is merged (push to the default
# branch = the merge event) and on demand via workflow_dispatch.

on:
  push:
    branches: [ master, main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'src/**'
      - 'build-aux/**'
      - 'lisp/**'
      - 'test/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    name: .zeln vs interpreter on the 582 real tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      # Warm build cache: the dump chain (dump -> byte-compile ~1600 files
      # -> re-dump) dominates cold CI time; the cache restores the .elc and
      # generated data so only changed files recompile.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            lisp/**/*.elc
            test/**/*.elc
            lisp/loaddefs.el
            lisp/**/*-loaddefs.el
            lisp/international/charprop.el
            lisp/international/charscript.el
            lisp/international/emoji-zwj.el
            lisp/international/uni-*.el
            lisp/international/cp51932.el
            lisp/international/eucjp-ms.el
            etc/charsets
            etc/DOC
            zig-out/bin/*.pdmp
          key: zigbuild-bench-${{ hashFiles('build.zig', 'build.zig.zon', 'build-aux/**', 'tools/**') }}-v1
          restore-keys: |
            zigbuild-bench-
            zigbuild-zeln-
            zigbuild-Linux-native-

      # Full build first (the default install puts the flag-correct temacs
      # into zig-out/bin; step-specific builds do not reinstall it), then
      # populate the .zeln cache over BOTH the lisp and test trees.
      - name: Build + populate .zeln cache (lisp + test tree)
        timeout-minutes: 45
        run: |
          zig build -Dnative-comp-zig=true -Dmodules-zig=true
          zig build -Dnative-comp-zig=true -Dmodules-zig=true populate-zeln-cache

      # The complete performance comparison: real 582-test suite, original
      # interpreter as baseline vs .zeln loading, best-of-3 each.  Tee the
      # summary line to a log for the job summary step.
      - name: Benchmark (real suite, interpreter baseline vs .zeln)
        timeout-minutes: 60
        run: |
          zig build -Dnative-comp-zig=true -Dmodules-zig=true bench-check 2>&1 | \
            tee "${{ runner.temp }}/bench.log"

      - name: Summarize
        id: summarize
        shell: bash
        run: |
          LINE=$(grep -a "bench-tests: ert suite" "${{ runner.temp }}/bench.log" | tail -1 || true)
          echo "bench_line=$LINE" >> "$GITHUB_OUTPUT"
          {
            echo "## Zeln Benchmark — real 582-test suite (interpreter baseline)"
            echo ""
            if [ -n "$LINE" ]; then
              echo "\`$LINE\`"
              echo ""
              echo "Ratio convention: zeln/interp < 1 means the .zeln path is faster"
              echo "than the original interpreter on the full real test suite."
            else
              echo "benchmark run failed — see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
