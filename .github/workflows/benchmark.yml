name: Zeln Benchmark (3-platform)

# Complete performance comparison on the REAL test/ ert suites across all
# three platforms simultaneously (Linux + macOS + Windows matrix):
#   * Linux  — the full .zeln benchmark: the same 582 built-in tests run
#     under the original interpreter (baseline) vs transparent .zeln
#     loading; bench-tests reports the best-of-3 wall-clock ratio.  (The
#     .zeln path is glibc-Linux only — build.zig gates it to
#     target.os == linux — so the native-comp comparison runs here.)
#   * macOS / Windows — platform build + the full 582 ert suite as the
#     validation baseline (the .zeln benchmark is not available on
#     non-glibc-Linux targets; the platform correctness gate is the
#     equivalent deliverable).
# Runs when a version is merged (push to the default branch = the merge
# event) and on demand via workflow_dispatch.

on:
  push:
    branches: [master, main]
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "tools/**"
      - "src/**"
      - "build-aux/**"
      - "lisp/**"
      - "test/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

# Least-privilege: this job only reads the repo and writes its own summary.
permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgnutls28-dev \
            libncurses-dev \
            libacl1-dev \
            libasound2-dev \
            libgpm-dev \
            libdbus-1-dev

      # Warm build cache: the dump chain (dump -> byte-compile ~1600 files
      # -> re-dump) dominates cold CI time; the cache restores the .elc and
      # generated data so only changed files recompile.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            lisp/**/*.elc
            test/**/*.elc
            lisp/loaddefs.el
            lisp/**/*-loaddefs.el
            lisp/international/charprop.el
            lisp/international/charscript.el
            lisp/international/emoji-zwj.el
            lisp/international/uni-*.el
            lisp/international/cp51932.el
            lisp/international/eucjp-ms.el
            etc/charsets
            etc/DOC
            zig-out/bin/*.pdmp
          key: zigbuild-bench-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build-aux/**', 'tools/**') }}-v1
          restore-keys: |
            zigbuild-bench-${{ runner.os }}-
            zigbuild-bench-
            zigbuild-Linux-native-

      # Full build first (the default install puts the flag-correct temacs
      # into zig-out/bin; step-specific builds do not reinstall it).  Linux
      # builds the .zeln + module features; macOS/Windows build the plain
      # platform binary (the .zeln path is gated to glibc-Linux).
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            zig build -Dnative-comp-zig=true -Dmodules-zig=true
          else
            zig build
          fi

      # ---- Linux: the real-suite .zeln benchmark. ----
      - name: Populate .zeln cache (lisp + test tree)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: zig build -Dnative-comp-zig=true -Dmodules-zig=true populate-zeln-cache

      # The complete performance comparison: real 582-test suite, original
      # interpreter as baseline vs .zeln loading, best-of-3 each.  Tee the
      # summary line to a log for the job summary step.
      - name: Benchmark (real suite, interpreter baseline vs .zeln)
        if: runner.os == 'Linux'
        timeout-minutes: 60
        run: |
          zig build -Dnative-comp-zig=true -Dmodules-zig=true bench-check 2>&1 | \
            tee "${{ runner.temp }}/bench.log"

      # ---- macOS / Windows: platform validation baseline (full 582). ----
      - name: Full 582-test suite (platform baseline)
        if: runner.os != 'Linux'
        timeout-minutes: 60
        env:
          ZIG_COMPILE_LISP_PROBE: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        shell: bash
        run: |
          # GitHub macOS runners sandbox the step process: writing to an
          # existing file is denied in /tmp and RUNNER_TEMP; the workspace
          # (zig-out is gitignored) is writable, so point TMPDIR there.
          mkdir -p "${PWD}/zig-out/tmp"
          export TMPDIR="${PWD}/zig-out/tmp"
          zig build test 2>&1 | tee "${{ runner.temp }}/bench.log"

      - name: Summarize
        shell: bash
        run: |
          LINE=$(grep -a "bench-tests: ert suite\|Ran [0-9]* tests" "${{ runner.temp }}/bench.log" | tail -1 || true)
          echo "bench_line=$LINE" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.os }} — Zeln Benchmark / platform validation"
            echo ""
            if [ "$RUNNER_OS" = "Linux" ]; then
              echo "Real 582-test suite, interpreter baseline vs .zeln (best-of-3):"
            else
              echo "Platform build + full 582-test suite baseline (.zeln is glibc-Linux only):"
            fi
            echo ""
            if [ -n "$LINE" ]; then
              echo "\`$LINE\`"
              echo ""
              echo "Ratio convention: zeln/interp < 1 means the .zeln path is faster"
              echo "than the original interpreter on the full real test suite."
            else
              echo "run failed — see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
